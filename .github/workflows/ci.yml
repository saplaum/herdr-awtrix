name: Checks and binaries

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: ubuntu-22.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Build standalone executable
        run: bun run build "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - name: Exercise the executable with no runtime on PATH
        run: bun test src/daemon.test.ts src/install.test.ts
        env:
          HERDR_AWTRIX_TEST_BINARY: ${{ github.workspace }}/dist/${{ matrix.target }}/herdr-awtrix
      - name: Package executable
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p release
          tar -czf "release/herdr-awtrix-${TARGET}.tar.gz" \
            -C "dist/${TARGET}" herdr-awtrix -C "$GITHUB_WORKSPACE" LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: herdr-awtrix-${{ matrix.target }}
          path: release/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: herdr-awtrix-*
          merge-multiple: true
          path: release
      - name: Create checksums and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd release && sha256sum *.tar.gz > SHA256SUMS)
          gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes
